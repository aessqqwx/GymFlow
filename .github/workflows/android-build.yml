name: Build GymFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build GymFlow Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug             --stacktrace             --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist

          APK=$(find app/build/outputs/apk/debug             -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          cp "$APK" dist/GymFlow-1.0-debug.apk

          sha256sum dist/GymFlow-1.0-debug.apk             > dist/GymFlow-1.0-debug.apk.sha256

          echo "===== APK ====="
          ls -lh dist/GymFlow-1.0-debug.apk

          echo "===== SHA256 ====="
          cat dist/GymFlow-1.0-debug.apk.sha256

      - name: Upload GymFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-1.0-debug
          path: |
            dist/GymFlow-1.0-debug.apk
            dist/GymFlow-1.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
