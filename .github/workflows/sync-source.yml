
name: Publish source without APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand reviewed source files
        run: |
          unzip -o GymGlow-source.zip
          rm GymGlow-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tools docs README.md GymGlow-source.zip
          git commit -m 'Publish GymFlow 1.5 application changes [skip ci]'
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - run: bash gradlew :logic-tests:run :app:compileDebugKotlin --no-daemon
