name: Setup and Build GymFlow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 1. Распаковываем исходники GymFlow
      # -------------------------------------------------

      - name: Unpack GymFlow source
        shell: bash
        run: |
          ZIP="GymFlow-1.0-source-release-candidate-with-wrapper.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          mkdir -p _gymflow_unpack
          unzip -q -o "$ZIP" -d _gymflow_unpack

          cp -a _gymflow_unpack/. .

          rm -rf _gymflow_unpack
          rm -f "$ZIP"

          chmod +x gradlew

          echo "GymFlow source unpacked successfully"

      # -------------------------------------------------
      # 2. Сохраняем распакованные файлы обратно в GitHub
      # -------------------------------------------------

      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack GymFlow 1.0 source"
            git push
          fi

      # -------------------------------------------------
      # 3. Java
      # -------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # -------------------------------------------------
      # 4. Android SDK
      # -------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # У GymFlow compileSdk = 37
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      # -------------------------------------------------
      # 5. Проверяем Wrapper
      # -------------------------------------------------

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      # -------------------------------------------------
      # 6. Настоящая Android-сборка
      # -------------------------------------------------

      - name: Build GymFlow Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # -------------------------------------------------
      # 7. Переименовываем APK
      # -------------------------------------------------

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist

          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          cp "$APK" dist/GymFlow-1.0-debug.apk

          sha256sum dist/GymFlow-1.0-debug.apk \
            > dist/GymFlow-1.0-debug.apk.sha256

          echo "APK:"
          ls -lh dist/

      # -------------------------------------------------
      # 8. APK появляется в GitHub Actions
      # -------------------------------------------------

      - name: Upload GymFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-1.0-debug
          path: |
            dist/GymFlow-1.0-debug.apk
            dist/GymFlow-1.0-debug.apk.sha256
          retention-days: 30
